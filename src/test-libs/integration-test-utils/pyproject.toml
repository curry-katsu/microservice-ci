[tool.poetry]
name = "integration-test-utils"
version = "0.1.0"
description = "Shared helpers for application integration tests."
authors = ["microservice-ci contributors"]
packages = [{ include = "integration_test_utils", from = "src" }]
include = ["src/integration_test_utils/py.typed"]

[tool.poetry.dependencies]
python = ">=3.14.6,<3.15"
boto3 = "^1.34.0"
psycopg = { version = "^3.2.0", extras = ["binary"] }

[tool.poetry.group.dev.dependencies]
black = "^24.4.2"
flake8 = "^7.1.0"
isort = "^5.13.2"
mypy = "^1.10.0"
pytest = "^8.2.2"
pytest-cov = "^5.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
exclude = ["\\.venv", "build", "dist"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.exceptions"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
