name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.projects.outputs.projects }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Discover Poetry projects
        id: projects
        shell: bash
        run: |
          projects="$(find src/applications src/libs -name pyproject.toml -not -path '*/.venv/*' -exec dirname {} \; | sort | jq -R -s -c 'split("\n")[:-1]')"
          echo "projects=${projects}" >> "$GITHUB_OUTPUT"

  validate:
    needs: discover
    if: ${{ needs.discover.outputs.projects != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.2.1"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: ${{ matrix.project }}/.venv
          key: venv-${{ runner.os }}-${{ matrix.project }}-${{ hashFiles(format('{0}/pyproject.toml', matrix.project), format('{0}/poetry.lock', matrix.project)) }}
          restore-keys: |
            venv-${{ runner.os }}-${{ matrix.project }}-

      - name: Install dependencies
        run: poetry install

      - name: Check import order
        run: poetry run isort --check-only .

      - name: Check formatting
        run: poetry run black --check .

      - name: Lint
        run: poetry run flake8 .

      - name: Type check
        run: poetry run mypy .

      - name: Test
        run: poetry run pytest --cov --cov-report=term --cov-report=xml
