name: CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
      - github-page-demo

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.projects.outputs.projects }}
      integration_projects: ${{ steps.projects.outputs.integration_projects }}
      mode: ${{ steps.projects.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover Poetry projects
        id: projects
        shell: bash
        run: |
          all_projects="$(find src/applications src/libs src/test-libs -name pyproject.toml -not -path '*/.venv/*' -exec dirname {} \; | sort)"
          integration_apps="$(find src/applications -name integration_tests -type d -not -path '*/.venv/*' -exec dirname {} \; | sort)"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            projects="$(printf '%s\n' "${all_projects}" | jq -R -s -c 'split("\n")[:-1]')"
            if [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
              changed_files="$(git ls-tree -r --name-only "${{ github.sha }}")"
            else
              changed_files="$(git diff --name-only "${{ github.event.before }}...${{ github.sha }}")"
            fi

            if printf '%s\n' "${changed_files}" | grep -Eq '^(\.github/workflows/ci\.yml|Makefile|pyproject\.toml|local-env/)'; then
              integration_projects="$(printf '%s\n' "${integration_apps}" | jq -R -s -c 'split("\n")[:-1]')"
            elif printf '%s\n' "${changed_files}" | grep -Eq '^(src/libs/|src/test-libs/)'; then
              integration_projects="$(printf '%s\n' "${integration_apps}" | jq -R -s -c 'split("\n")[:-1]')"
            else
              integration_projects="$(
                while IFS= read -r project; do
                  if printf '%s\n' "${changed_files}" | grep -q "^${project}/"; then
                    printf '%s\n' "${project}"
                  fi
                done <<< "${integration_apps}" | sort -u | jq -R -s -c 'split("\n")[:-1]'
              )"
            fi

            echo "mode=all" >> "$GITHUB_OUTPUT"
            echo "projects=${projects}" >> "$GITHUB_OUTPUT"
            echo "integration_projects=${integration_projects}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="${{ github.event.pull_request.base.sha }}"
          changed_files="$(git diff --name-only "${base_sha}...HEAD")"

          if printf '%s\n' "${changed_files}" | grep -Eq '^(\.github/workflows/ci\.yml|pyproject\.toml)$'; then
            projects="$(printf '%s\n' "${all_projects}" | jq -R -s -c 'split("\n")[:-1]')"
            echo "mode=all" >> "$GITHUB_OUTPUT"
            echo "projects=${projects}" >> "$GITHUB_OUTPUT"
            echo "integration_projects=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          projects="$(
            while IFS= read -r project; do
              if printf '%s\n' "${changed_files}" | grep -q "^${project}/"; then
                printf '%s\n' "${project}"
              fi
            done <<< "${all_projects}" | sort -u | jq -R -s -c 'split("\n")[:-1]'
          )"

          echo "mode=changed" >> "$GITHUB_OUTPUT"
          echo "projects=${projects}" >> "$GITHUB_OUTPUT"
          echo "integration_projects=[]" >> "$GITHUB_OUTPUT"

  validate:
    needs: discover
    if: ${{ github.event_name == 'pull_request' && needs.discover.outputs.projects != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.2.1"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: ${{ matrix.project }}/.venv
          key: venv-${{ runner.os }}-python-${{ steps.setup-python.outputs.python-version }}-${{ matrix.project }}-${{ hashFiles(format('{0}/pyproject.toml', matrix.project), format('{0}/poetry.lock', matrix.project)) }}
          restore-keys: |
            venv-${{ runner.os }}-python-${{ steps.setup-python.outputs.python-version }}-${{ matrix.project }}-

      - name: Use selected Python
        run: poetry env use "$(command -v python)"

      - name: Install dependencies
        run: poetry install

      - name: Check import order
        run: poetry run isort --check-only .

      - name: Check formatting
        run: poetry run black --check .

      - name: Lint
        run: poetry run flake8 .

      - name: Type check
        run: poetry run mypy .

      - name: Test
        shell: bash
        run: |
          poetry run coverage erase
          set +e
          poetry run coverage run --source=src -m pytest
          rc=$?
          set -e
          if [[ "${rc}" -ne 0 && "${rc}" -ne 5 ]]; then
            exit "${rc}"
          fi
          poetry run coverage report -i --include='src/*' --omit='*/tests/*'
          poetry run coverage xml -i -o coverage.xml --include='src/*' --omit='*/tests/*'

  unit-test-all:
    needs: discover
    if: ${{ github.event_name == 'push' && needs.discover.outputs.projects != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.2.1"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: ${{ matrix.project }}/.venv
          key: venv-${{ runner.os }}-python-${{ steps.setup-python.outputs.python-version }}-${{ matrix.project }}-${{ hashFiles(format('{0}/pyproject.toml', matrix.project), format('{0}/poetry.lock', matrix.project)) }}
          restore-keys: |
            venv-${{ runner.os }}-python-${{ steps.setup-python.outputs.python-version }}-${{ matrix.project }}-

      - name: Use selected Python
        run: poetry env use "$(command -v python)"

      - name: Install dependencies
        run: poetry install

      - name: Unit test
        shell: bash
        run: |
          poetry run coverage erase
          set +e
          poetry run coverage run --source=src -m pytest
          rc=$?
          set -e
          if [[ "${rc}" -ne 0 && "${rc}" -ne 5 ]]; then
            exit "${rc}"
          fi
          poetry run coverage report -i --include='src/*' --omit='*/tests/*'
          poetry run coverage xml -i -o coverage.xml --include='src/*' --omit='*/tests/*'

      - name: Prepare coverage artifact
        shell: bash
        run: |
          mkdir -p coverage-artifact
          cp coverage.xml coverage-artifact/coverage.xml
          printf '%s\n' "${{ matrix.project }}" > coverage-artifact/project.txt

      - name: Upload unit coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-${{ hashFiles(format('{0}/pyproject.toml', matrix.project)) }}
          path: ${{ matrix.project }}/coverage-artifact/
          retention-days: 14

  update-readme-badges:
    needs: unit-test-all
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"

      - name: Download unit coverage reports
        if: ${{ needs.unit-test-all.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          pattern: unit-coverage-*
          path: coverage-input

      - name: Generate combined coverage XML
        if: ${{ needs.unit-test-all.result == 'success' }}
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          total_lines = 0
          covered_lines = 0
          for report_path in sorted(pathlib.Path("coverage-input").glob("*/coverage.xml")):
              root = ET.parse(report_path).getroot()
              total_lines += int(root.attrib.get("lines-valid", "0"))
              covered_lines += int(root.attrib.get("lines-covered", "0"))

          line_rate = covered_lines / total_lines if total_lines else 0.0
          coverage = ET.Element(
              "coverage",
              {
                  "line-rate": f"{line_rate:.6f}",
                  "lines-covered": str(covered_lines),
                  "lines-valid": str(total_lines),
              },
          )
          ET.ElementTree(coverage).write(
              "coverage.xml",
              encoding="utf-8",
              xml_declaration=True,
          )
          print(
              f"Combined coverage: {covered_lines}/{total_lines} "
              f"({round(line_rate * 100)}%)"
          )
          PY

      - name: Upload combined coverage report
        if: ${{ needs.unit-test-all.result == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: combined-coverage-report
          path: coverage.xml
          retention-days: 14

      - name: Update README badges
        shell: bash
        run: |
          test_result="${{ needs.unit-test-all.result }}"

          if [[ "${test_result}" == "success" ]]; then
            test_badge="![Unit Tests](https://img.shields.io/badge/unit_tests-passing-brightgreen)"
          elif [[ "${test_result}" == "skipped" ]]; then
            test_badge="![Unit Tests](https://img.shields.io/badge/unit_tests-skipped-lightgrey)"
          else
            test_badge="![Unit Tests](https://img.shields.io/badge/unit_tests-failed-red)"
          fi

          awk -v badge="${test_badge}" '
            /<!-- unit-test-status:start -->/ {
              print
              print badge
              in_block = 1
              next
            }
            /<!-- unit-test-status:end -->/ {
              in_block = 0
              print
              next
            }
            !in_block { print }
          ' README.md > README.md.tmp
          mv README.md.tmp README.md

          if [[ "${test_result}" == "success" ]]; then
            coverage="$(python -c 'import xml.etree.ElementTree as ET; root = ET.parse("coverage.xml").getroot(); print(round(float(root.attrib["line-rate"]) * 100))')"

            if (( coverage >= 90 )); then
              color="brightgreen"
            elif (( coverage >= 80 )); then
              color="green"
            elif (( coverage >= 70 )); then
              color="yellow"
            else
              color="orange"
            fi

            coverage_badge="![Unit Test Coverage](https://img.shields.io/badge/unit_test_coverage-${coverage}%25-${color})"
            awk -v badge="${coverage_badge}" '
            /<!-- unit-test-coverage:start -->/ {
              print
              print badge
              in_block = 1
              next
            }
            /<!-- unit-test-coverage:end -->/ {
              in_block = 0
              print
              next
            }
            !in_block { print }
            ' README.md > README.md.tmp
            mv README.md.tmp README.md
          fi

      - name: Commit README badges
        shell: bash
        run: |
          if git diff --quiet README.md; then
            echo "README badges are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README test badges [skip ci]"
          git push

  integration-test:
    needs: discover
    if: ${{ github.event_name == 'push' && needs.discover.outputs.integration_projects != '[]' }}
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ap-northeast-1
      AWS_ENDPOINT_URL: http://localhost:4566
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.integration_projects) }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.2.1"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: ${{ matrix.project }}/.venv
          key: venv-${{ runner.os }}-python-${{ steps.setup-python.outputs.python-version }}-${{ matrix.project }}-${{ hashFiles(format('{0}/pyproject.toml', matrix.project), format('{0}/poetry.lock', matrix.project)) }}
          restore-keys: |
            venv-${{ runner.os }}-python-${{ steps.setup-python.outputs.python-version }}-${{ matrix.project }}-

      - name: Start local environment
        working-directory: .
        run: docker compose -f local-env/docker-compose.yml up -d

      - name: Use selected Python
        run: poetry env use "$(command -v python)"

      - name: Install dependencies
        run: poetry install

      - name: Integration test
        shell: bash
        run: |
          mkdir -p allure-results
          poetry run pytest integration_tests --alluredir allure-results

      - name: Stop local environment
        if: ${{ always() }}
        working-directory: .
        run: docker compose -f local-env/docker-compose.yml down

      - name: Prepare Allure artifact
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p allure-artifact
          cp -R allure-results allure-artifact/allure-results
          printf '%s\n' "${{ matrix.project }}" > allure-artifact/project.txt

      - name: Upload Allure results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ hashFiles(format('{0}/pyproject.toml', matrix.project)) }}
          path: ${{ matrix.project }}/allure-artifact/
          retention-days: 14

  publish-quality-dashboard:
    needs:
      - unit-test-all
      - integration-test
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/github-page-demo' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download unit coverage reports
        if: ${{ needs.unit-test-all.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          pattern: unit-coverage-*
          path: coverage-input

      - name: Download Allure results
        if: ${{ needs.integration-test.result != 'skipped' }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: allure-results-*
          path: allure-input

      - name: Build dashboard shell
        shell: bash
        run: |
          mkdir -p site/allure site/coverage
          python - <<'PY'
          import datetime as dt
          import html
          import json
          import pathlib
          import xml.etree.ElementTree as ET

          total_lines = 0
          covered_lines = 0
          for report_path in sorted(pathlib.Path("coverage-input").glob("*/coverage.xml")):
              root = ET.parse(report_path).getroot()
              total_lines += int(root.attrib.get("lines-valid", "0"))
              covered_lines += int(root.attrib.get("lines-covered", "0"))

          coverage_rate = round((covered_lines / total_lines) * 100, 1) if total_lines else None
          generated_at = dt.datetime.now(dt.UTC).replace(microsecond=0).isoformat()
          summary = {
              "branch": "${{ github.ref_name }}",
              "commit": "${{ github.sha }}",
              "workflow_run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "generated_at": generated_at,
              "unit_test_result": "${{ needs.unit-test-all.result }}",
              "integration_test_result": "${{ needs.integration-test.result }}",
              "coverage_rate": coverage_rate,
              "covered_lines": covered_lines,
              "total_lines": total_lines,
          }

          pathlib.Path("site/quality-summary.json").write_text(
              json.dumps(summary, indent=2) + "\n",
              encoding="utf-8",
          )
          pathlib.Path("site/allure/index.html").write_text(
              "<!doctype html><html lang=\"ja\"><meta charset=\"utf-8\">"
              "<title>No Allure results</title>"
              "<body><h1>No Allure results</h1>"
              "<p>No integration test result artifacts were found.</p>"
              "</body></html>\n",
              encoding="utf-8",
          )

          coverage_label = "N/A" if coverage_rate is None else f"{coverage_rate}%"
          commit_short = "${{ github.sha }}"[:7]
          workflow_url = html.escape(summary["workflow_run"])
          index = f"""<!doctype html>
          <html lang="ja">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>microservice-ci quality dashboard</title>
            <style>
              body {{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; color: #17202a; background: #f7f9fb; }}
              main {{ max-width: 980px; margin: 0 auto; padding: 40px 24px; }}
              h1 {{ font-size: 28px; margin: 0 0 8px; }}
              .meta {{ color: #536270; margin: 0 0 28px; }}
              .grid {{ display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin-bottom: 28px; }}
              .card {{ background: white; border: 1px solid #d8e0e8; border-radius: 8px; padding: 18px; }}
              .label {{ color: #536270; font-size: 13px; margin-bottom: 8px; }}
              .value {{ font-size: 26px; font-weight: 700; }}
              a {{ color: #0b65c2; }}
              .links {{ display: flex; flex-wrap: wrap; gap: 12px; }}
              .links a {{ background: white; border: 1px solid #c7d3df; border-radius: 6px; padding: 10px 14px; text-decoration: none; font-weight: 600; }}
            </style>
          </head>
          <body>
            <main>
              <h1>microservice-ci quality dashboard</h1>
              <p class="meta">Branch {html.escape(summary["branch"])} / commit {commit_short} / generated {html.escape(generated_at)}</p>
              <section class="grid">
                <div class="card"><div class="label">Unit tests</div><div class="value">{html.escape(summary["unit_test_result"])}</div></div>
                <div class="card"><div class="label">Integration tests</div><div class="value">{html.escape(summary["integration_test_result"])}</div></div>
                <div class="card"><div class="label">Line coverage</div><div class="value">{coverage_label}</div></div>
              </section>
              <nav class="links">
                <a href="./allure/">Allure report</a>
                <a href="./quality-summary.json">Summary JSON</a>
                <a href="{workflow_url}">Workflow run</a>
              </nav>
            </main>
          </body>
          </html>
          """
          pathlib.Path("site/index.html").write_text(index, encoding="utf-8")
          PY

      - name: Set up Java for Allure
        if: ${{ needs.integration-test.result != 'skipped' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate Allure report
        if: ${{ needs.integration-test.result != 'skipped' }}
        shell: bash
        run: |
          mkdir -p merged-allure-results
          while IFS= read -r result_dir; do
            cp -R "${result_dir}/." merged-allure-results/
          done < <(find allure-input -type d -name allure-results | sort)

          if find merged-allure-results -type f | grep -q .; then
            npm install -g allure-commandline
            allure generate merged-allure-results --clean -o site/allure
          else
            cat > site/allure/index.html <<'HTML'
          <!doctype html>
          <html lang="ja"><meta charset="utf-8"><title>No Allure results</title>
          <body><h1>No Allure results</h1><p>No integration test result artifacts were found.</p></body></html>
          HTML
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  no-changes:
    needs: discover
    if: ${{ github.event_name == 'pull_request' && needs.discover.outputs.projects == '[]' }}
    runs-on: ubuntu-latest
    steps:
      - name: No changed Poetry projects
        run: echo "No changed Poetry projects to validate."
